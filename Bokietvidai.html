<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Poop 3D - Bo Kiet Vi Dai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background-color: #050505; font-family: sans-serif; }
        #webcam { display: none; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #d2b48c; font-size: 18px; letter-spacing: 2px;
            pointer-events: none; z-index: 10; font-weight: bold;
            transition: opacity 0.5s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">ĐANG HIỂN THỊ BÃI CỨT EMOJI...</div>
    <video id="webcam" playsinline></video>

    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. TẠO TẤM BẢNG VẼ BÃI CỨT EMOJI (CANVAS)
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        function drawPoopWithUserImage(userImg = null) {
            ctx.clearRect(0, 0, 512, 512);

            // --- VẼ THÂN BÃI CỨT (MÀU NÂU NỎN NÀ 3 TẦNG) ---
            ctx.fillStyle = '#8B4513';
            ctx.strokeStyle = '#5C2E0B';
            ctx.lineWidth = 10;

            // Tầng đáy
            ctx.beginPath();
            ctx.ellipse(256, 400, 180, 70, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Tầng giữa
            ctx.beginPath();
            ctx.ellipse(256, 300, 140, 60, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Tầng trên
            ctx.beginPath();
            ctx.ellipse(256, 210, 90, 45, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Chóp nhọn xoắn
            ctx.beginPath();
            ctx.moveTo(210, 180);
            ctx.quadraticCurveTo(256, 100, 290, 80);
            ctx.quadraticCurveTo(270, 130, 280, 170);
            ctx.fill(); ctx.stroke();

            // --- VẼ MẮT EMOJI CƯỜI ---
            // Mắt trái
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(200, 280, 35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(200, 280, 18, 0, Math.PI * 2); ctx.fill();

            // Mắt phải
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(312, 280, 35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(312, 280, 18, 0, Math.PI * 2); ctx.fill();

            // Miệng cười
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(256, 330, 50, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // --- NẾU LOAD ĐƯỢC ẢNH CỦA BẠN: ĐẮP ẢNH VÀO TÂM BÃI CỨT ---
            if (userImg) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(256, 210, 40, 0, Math.PI * 2); // Khung tròn trên tầng trên
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(userImg, 216, 170, 80, 80);
                ctx.restore();
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(256, 210, 40, 0, Math.PI * 2); ctx.stroke();
            }
        }

        // Vẽ bãi phân ban đầu
        drawPoopWithUserImage();

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const poopSprite = new THREE.Sprite(material);
        poopSprite.scale.set(28, 28, 1);
        scene.add(poopSprite);

        // Load ảnh IMG_0501.jpeg lồng vào
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = 'IMG_0501.jpeg';
        img.onload = () => {
            drawPoopWithUserImage(img);
            texture.needsUpdate = true;
        };

        // 3. MEDIAPIPE HANDS DETECT
        let openHandFactor = 0;
        function onResults(results) {
            document.getElementById('loading').style.opacity = '0';
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const wrist = hand[0];
                let totalDist = 0;
                const tips = [4, 8, 12, 16, 20];
                tips.forEach(idx => {
                    totalDist += Math.hypot(hand[idx].x - wrist.x, hand[idx].y - wrist.y);
                });
                let avgDist = totalDist / 5;
                let targetFactor = THREE.MathUtils.mapLinear(avgDist, 0.25, 0.48, 0, 1);
                openHandFactor = THREE.MathUtils.clamp(targetFactor, 0, 1);
            } else {
                openHandFactor = 0;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // 4. ANIMATION LOOP
        let clock = new THREE.Clock();
        let currentFactor = 0;

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();
            currentFactor += (openHandFactor - currentFactor) * 0.1;

            // Đống phân lắc lư nhún nhảy
            poopSprite.rotation.z = Math.sin(time * 2) * 0.1;
            
            // Xòe tay ra thì bãi phân phóng to cực đại & biến mất!
            let scaleVal = 28 * (1 + currentFactor * 1.5);
            poopSprite.scale.set(scaleVal, scaleVal, 1);
            material.opacity = 1 - currentFactor;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
