<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Heart 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background-color: #000; font-family: sans-serif; }
        #webcam { display: none; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 18px; letter-spacing: 2px;
            pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
</head>
<body>

    <div id="loading">ĐANG KHỞI TẠO...</div>
    <video id="webcam" playsinline></video>

    <script>
        // --- 1. SETUP SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- 2. TẠO HẠT TRÁI TIM ---
        const particleCount = 25000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const basePositions = new Float32Array(particleCount * 3);
        const randomDirs = new Float32Array(particleCount * 3); // Hướng văng ra khi nổ

        for (let i = 0; i < particleCount; i++) {
            // Công thức trái tim chuẩn
            let t = Math.PI * (Math.random() * 2 - 1);
            let p = Math.PI * (Math.random() * 2 - 1);

            // Tỷ lệ chuẩn video
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            let z = 6 * Math.sin(t) * Math.sin(p);

            // Bán kính lõi
            let r = 0.4 + Math.random() * 0.6;
            x *= r; y *= r; z *= r;

            let scale = 0.75;
            basePositions[i * 3]     = x * scale;
            basePositions[i * 3 + 1] = y * scale;
            basePositions[i * 3 + 2] = z * scale;

            positions[i * 3]     = basePositions[i * 3];
            positions[i * 3 + 1] = basePositions[i * 3 + 1];
            positions[i * 3 + 2] = basePositions[i * 3 + 2];

            // Vectơ hướng văng ngẫu nhiên khi xòe bàn tay
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos(2 * Math.random() - 1);
            randomDirs[i * 3]     = Math.sin(phi) * Math.cos(theta);
            randomDirs[i * 3 + 1] = Math.sin(phi) * Math.sin(theta);
            randomDirs[i * 3 + 2] = Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Texture Hạt Sáng Mờ
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 32);

        const material = new THREE.PointsMaterial({
            color: 0xff3388,
            size: 0.45,
            map: new THREE.CanvasTexture(canvas),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const heartParticles = new THREE.Points(geometry, material);
        scene.add(heartParticles);

        // GUI Controls
        const params = { color: '#ff3388', particleSize: 0.45 };
        const gui = new dat.GUI();
        gui.addColor(params, 'color').onChange(v => material.color.set(v));
        gui.add(params, 'particleSize', 0.1, 2.0).onChange(v => material.size = v);

        // --- 3. MEDIAPIPE HANDS ---
        let openHandFactor = 0; // 0 = Nắm tay (Bình thường), 1 = Xòe tay (Nổ văng hạt)

        function onResults(results) {
            document.getElementById('loading').style.display = 'none';
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];

                // Khoảng cách từ Cổ tay (0) tới các Đầu ngón tay (4, 8, 12, 16, 20)
                const wrist = hand[0];
                let totalDist = 0;
                const tips = [4, 8, 12, 16, 20];
                
                tips.forEach(idx => {
                    totalDist += Math.hypot(hand[idx].x - wrist.x, hand[idx].y - wrist.y);
                });
                
                let avgDist = totalDist / 5;

                // Chuẩn hóa: avgDist nhỏ (< 0.25) = Nắm/Bình thường, lớn (> 0.45) = Xòe tay hết cỡ
                let targetFactor = THREE.MathUtils.mapLinear(avgDist, 0.25, 0.48, 0, 1);
                openHandFactor = THREE.MathUtils.clamp(targetFactor, 0, 1);
            } else {
                openHandFactor = 0;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- 4. ANIMATION LOOP ---
        let clock = new THREE.Clock();
        let currentFactor = 0;

        function animate() {
            requestAnimationFrame(animate);

            let time = clock.getElapsedTime();

            // Mượt hóa biến đổi tay
            currentFactor += (openHandFactor - currentFactor) * 0.1;

            // Xoay nhẹ khối
            heartParticles.rotation.y = time * 0.2;

            // Nhịp đập trái tim tự nhiên
            let pulse = Math.sin(time * 3) * 0.05 + 1;

            const posAttr = geometry.attributes.position;
            
            for (let i = 0; i < particleCount; i++) {
                let ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;

                // Vị trí khi thành hình trái tim
                let tx = basePositions[ix] * pulse;
                let ty = basePositions[iy] * pulse;
                let tz = basePositions[iz] * pulse;

                // Vị trí khi nổ văng ra
                let blastDist = 25 + Math.sin(i + time) * 10;
                let bx = tx + randomDirs[ix] * blastDist;
                let by = ty + randomDirs[iy] * blastDist;
                let bz = tz + randomDirs[iz] * blastDist;

                // Interpolate giữa Trái tim và Hiệu ứng Nổ
                posAttr.array[ix] += ((tx * (1 - currentFactor) + bx * currentFactor) - posAttr.array[ix]) * 0.12;
                posAttr.array[iy] += ((ty * (1 - currentFactor) + by * currentFactor) - posAttr.array[iy]) * 0.12;
                posAttr.array[iz] += ((tz * (1 - currentFactor) + bz * currentFactor) - posAttr.array[iz]) * 0.12;
            }
            posAttr.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
